<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mê Văn Học — Đã kết nối TikTok (Demo)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  h1 { font-size: 24px; }
  .ok { background: #e8f8ee; border-left: 4px solid #22a55b; padding: 12px 16px; margin: 20px 0; }
  .err { background: #fdecea; border-left: 4px solid #d92d20; padding: 12px 16px; margin: 20px 0; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<h1>Kết quả đăng nhập TikTok</h1>
<div id="result">Đang xử lý...</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const box = document.getElementById('result');
  if (code) {
    box.innerHTML = '<div class="ok"><strong>Đã kết nối TikTok thành công (Sandbox).</strong><br>Tài khoản thử nghiệm đã ủy quyền cho công cụ với quyền xem thông tin cơ bản và đăng video.</div>'
      + '<p>Mã ủy quyền nhận được: <code>' + code.replace(/</g, '&lt;') + '</code></p>'
      + '<p>Bước tiếp theo: công cụ dùng mã này để đổi lấy access token, rồi gọi Content Posting API để đăng video lên dưới dạng bản nháp.</p>';
  } else if (error) {
    box.innerHTML = '<div class="err"><strong>Đăng nhập chưa thành công:</strong> ' + error.replace(/</g, '&lt;') + '</div>';
  } else {
    box.innerHTML = '<p>Không nhận được mã ủy quyền. Vui lòng quay lại và thử đăng nhập lại.</p>';
  }
</script>
<p><a href="demo.html">← Quay lại trang demo</a></p>
</body>
</html>
